<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AE-20 運指トレーニング</title>
<style>
  :root {
    --bg: #f4f2ee;
    --card: #ffffff;
    --ink: #2b2a28;
    --sub: #7a766f;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --ok: #1d9a5b;
    --ng: #d64545;
    --line: #e3dfd8;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px; margin-bottom: 14px;
  }
  h1 { font-size: 20px; letter-spacing: .02em; }
  h1 small { font-size: 12px; color: var(--sub); font-weight: normal; margin-left: 8px; }

  .stats { display: flex; gap: 14px; font-size: 13px; color: var(--sub); }
  .stats b { color: var(--ink); font-size: 16px; margin-left: 3px; }

  header .spacer { flex: 1; }
  button.ghost {
    font-size: 13px; padding: 6px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.ghost.icon { padding: 6px 10px; font-size: 15px; line-height: 1; }

  /* ---- 設定モーダル ---- */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .modal[hidden] { display: none; }
  .sheet {
    background: var(--card); border-radius: var(--radius);
    padding: 16px 18px; width: min(420px, calc(100% - 32px));
    max-height: 85dvh; overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
  }
  .sheet-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; margin-bottom: 12px;
  }
  .sheet .row {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; padding: 10px 0;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .sheet select {
    flex: 1; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; color: var(--ink);
  }
  .sheet .about {
    font-size: 11.5px; color: var(--sub); line-height: 1.7; padding-top: 12px;
  }
  @media (max-width: 600px) {
    .modal { align-items: flex-end; }
    .sheet {
      width: 100%; border-radius: var(--radius) var(--radius) 0 0;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
  }

  .question {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 8px 16px 2px; margin-bottom: 14px;
    text-align: center;
  }
  #staff { display: block; margin: 0 auto; max-width: 280px; width: 100%; }

  /* 出題文と結果表示を兼ねる1行 */
  .feedback {
    min-height: 28px; font-size: 15px; color: var(--sub);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding-bottom: 6px;
  }
  .feedback.ok { color: var(--ok); font-weight: bold; }
  .feedback.ng { color: var(--ng); font-weight: bold; }

  .choices {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }

  .choice {
    background: var(--card); border: 2px solid var(--line);
    border-radius: var(--radius); padding: 8px 4px 4px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    transition: transform .1s, border-color .1s, box-shadow .1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .choice:hover:not(.disabled):not(.correct) {
    transform: translateY(-2px); border-color: var(--accent);
    box-shadow: 0 4px 10px rgba(0,0,0,.07);
  }
  .choice svg { width: 100%; max-width: 150px; height: auto; }
  .choice .num {
    font-size: 11px; color: var(--sub); padding: 2px 0 4px;
  }
  .choice.wrong { border-color: var(--ng); opacity: .45; cursor: default; animation: shake .3s; }
  .choice.correct { border-color: var(--ok); box-shadow: 0 0 0 3px rgba(29,154,91,.25); cursor: default; }
  .choice.disabled { cursor: default; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* ---- スマホ向け：100dvh に収めてスクロール不要にする ---- */
  @media (max-width: 600px) {
    html, body { height: 100dvh; overflow: hidden; }
    body {
      padding: 8px 10px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }
    .wrap { height: 100%; display: flex; flex-direction: column; }
    header { margin-bottom: 8px; gap: 6px; flex-wrap: nowrap; align-items: center; }
    h1 { font-size: 16px; white-space: nowrap; }
    .stats { gap: 10px; font-size: 12px; white-space: nowrap; }
    .stats b { font-size: 14px; }
    button.ghost { font-size: 12px; padding: 5px 9px; }

    .question { flex: none; padding: 4px 8px 0; margin-bottom: 8px; }
    #staff { max-width: 200px; }
    .feedback { min-height: 22px; font-size: 13.5px; padding-bottom: 4px; }

    /* 残りの高さを6択(3×2)で使い切る。運指図は枠に合わせて自動縮小 */
    .choices {
      flex: 1; min-height: 0;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 8px;
    }
    .choice { min-height: 0; border-radius: 10px; padding: 4px 2px 2px; }
    .choice svg { flex: 1; min-height: 0; width: 100%; max-width: none; height: 100%; }
    .choice .num { display: none; }
    .choice:hover:not(.disabled):not(.correct) { transform: none; box-shadow: none; }
  }
  /* 高さの低い端末では楽譜をさらに小さく */
  @media (max-width: 600px) and (max-height: 720px) {
    #staff { max-width: 170px; }
    .feedback { min-height: 20px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AE-20 運指</h1>
    <div class="stats">
      <span>正解<b id="stat-ok">0</b><span style="font-size:11px">/</span><b id="stat-total" style="font-size:13px">0</b></span>
      <span>連続<b id="stat-streak">0</b></span>
    </div>
    <span class="spacer"></span>
    <button class="ghost" id="skip">スキップ ▸</button>
    <button class="ghost icon" id="menu-btn" aria-label="設定">⚙</button>
  </header>

  <div class="question">
    <svg id="staff" viewBox="0 0 280 190" aria-label="出題の音符"></svg>
    <div class="feedback" id="feedback">この音の運指はどれ？</div>
  </div>

  <div class="choices" id="choices"></div>

  <div class="modal" id="modal" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <b>設定</b>
        <button class="ghost icon" id="menu-close" aria-label="閉じる">✕</button>
      </div>
      <label class="row">出題範囲
        <select id="range">
          <option value="mid">まずはここから（ソ4〜ド5）</option>
          <option value="low">低音域（シ♭3〜シ4）</option>
          <option value="high">高音域（ド5〜ファ♯5）</option>
          <option value="all" selected>全音域（シ♭3〜ファ♯5）</option>
        </select>
      </label>
      <label class="row"><input type="checkbox" id="accidentals"> ♯・♭を含む</label>
      <label class="row"><input type="checkbox" id="sound" checked> 正解音を鳴らす</label>
      <div class="about">
        図と運指は Roland AE-20 オーナーズマニュアルの運指表（Sax）から抽出した公式データです。オレンジ＝押すキー。
        出題範囲は運指表と同じ B♭3〜F♯5（裏側の親指オクターブキーは全体をオクターブ移調するもので、運指表には含まれません）。
        複数の運指がある音は第1候補を正解としています。
        再生音は記譜音（実音はアルトサックス音色の場合、長6度下のE♭管実音になります）。
      </div>
    </div>
  </div>
</div>

const SVGNS = "http://www.w3.org/2000/svg";
function el(name, attrs, text) {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

function drawStaff(note) {
  const svg = document.getElementById("staff");
  svg.innerHTML = "";
  const left = 26, right = 254;
  const bottomY = 130, gap = 16, half = gap / 2;

  // 五線
  for (let i = 0; i < 5; i++) {
    const y = bottomY - i * gap;
    svg.appendChild(el("line", { x1:left, y1:y, x2:right, y2:y, stroke:"#555", "stroke-width":1.2 }));
  }
  // ト音記号（フォント非依存の自前パス。渦巻きの中心をG線=第2線 y=114 に合わせる）
  drawClef(svg);

  const nx = 165;
  const ny = bottomY - note.step * half;

  // 加線（五線の外の偶数ステップに引く）
  const ledger = [];
  for (let s = -2; s >= note.step; s -= 2) ledger.push(s);
  for (let s = 10; s <= note.step; s += 2) ledger.push(s);
  for (const s of ledger) {
    const y = bottomY - s * half;
    svg.appendChild(el("line", { x1:nx-15, y1:y, x2:nx+15, y2:y, stroke:"#555", "stroke-width":1.2 }));
  }

  // 臨時記号
  if (note.acc) {
    svg.appendChild(el("text", {
      x: nx - 32, y: ny + (note.acc === "b" ? 3 : 6),
      "font-size": 30, "font-family": "serif", fill: "#222",
      "text-anchor": "middle"
    }, note.acc === "#" ? "♯" : "♭"));
  }

  // 符頭（少し傾いた楕円）
  const head = el("ellipse", { cx:nx, cy:ny, rx:8.2, ry:6, fill:"#222" });
  head.setAttribute("transform", `rotate(-18 ${nx} ${ny})`);
  svg.appendChild(head);

  // 符幹（第3線より下は上向き、上は下向き）
  const stemLen = 46;
  if (note.step < 4) {
    svg.appendChild(el("line", { x1:nx+7.6, y1:ny-2, x2:nx+7.6, y2:ny-stemLen, stroke:"#222", "stroke-width":1.6 }));
  } else {
    svg.appendChild(el("line", { x1:nx-7.6, y1:ny+2, x2:nx-7.6, y2:ny+stemLen, stroke:"#222", "stroke-width":1.6 }));
  }
}

function drawClef(svg) {
  // 上のループ → 縦の軸 → G線を巻く渦 → 下のフックと玉、を一筆のストロークで描く
  const d = `
    M 46 50
    C 40 56 40 68 46 80
    C 54 94 58 102 59 112
    C 60 126 52 132 44 131
    C 34 130 30 120 34 112
    C 38 105 48 105 51 112
    C 53 118 49 123 44 122
    M 46 50
    C 52 45 58 54 58 64
    C 58 82 48 96 47 118
    C 46.5 130 48 138 49 146
    C 50 154 42 158 37 154
    C 33 150 36 144 41 145
  `;
  svg.appendChild(el("path", {
    d, fill: "none", stroke: "#333",
    "stroke-width": 3.4, "stroke-linecap": "round", "stroke-linejoin": "round"
  }));
  svg.appendChild(el("circle", { cx: 39, cy: 150, r: 3.4, fill: "#333" }));
}

/* ============================================================
 * 運指図の描画（SVG）
 * Roland AE-20 オーナーズマニュアルの運指表からベクター抽出した
 * 実機シルエットとキー形状を、公式アプリの Fingering 画面と同じ
 * 配色（白ボディ＋黒アウトライン、押すキーはオレンジ）で描く。
 * ============================================================ */
const INK = "#1c1c1c";       // アウトライン
const ORANGE = "#f2591d";    // 押すキー
const BODY = "#ffffff";      // ボディ

function drawFingering(f) {
  const m = 2.5;
  const svg = el("svg", { viewBox: `${-m} ${-m} ${AE20.w + 2 * m} ${AE20.h + 2 * m}` });
  svg.appendChild(el("path", {
    d: AE20.body, fill: BODY, stroke: INK, "stroke-width": 0.9,
    "fill-rule": "evenodd", "stroke-linejoin": "round"
  }));
  for (const k of AE20.keys) {
    svg.appendChild(el("path", {
      d: k.d, fill: f.includes(k.i) ? ORANGE : BODY,
      stroke: INK, "stroke-width": 0.45, "stroke-linejoin": "round"
    }));
  }
  return svg;
}

/* ============================================================
 * サウンド（Web Audio）
 * ============================================================ */
let audioCtx = null;
function playNote(midi) {
  if (!document.getElementById("sound").checked) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const t = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.22, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    gain.connect(audioCtx.destination);
    // 矩形波+三角波を混ぜてリード楽器っぽく
    for (const [type, vol] of [["sawtooth", 0.5], ["triangle", 0.5]]) {
      const osc = audioCtx.createOscillator();
      osc.type = type;
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.value = vol;
      osc.connect(g).connect(gain);
      osc.start(t);
      osc.stop(t + 1);
    }
  } catch (e) { /* 音が出なくてもクイズは続行 */ }
}

/* ============================================================
 * クイズ本体
 * ============================================================ */
const state = { current: null, answered: false, ok: 0, total: 0, streak: 0, missedThisQ: false, lastId: null };

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function newQuestion() {
  const rangeFn = RANGES[document.getElementById("range").value];
  const useAcc = document.getElementById("accidentals").checked;
  let pool = NOTES.filter(n => rangeFn(n) && (useAcc || !n.acc));
  if (pool.length === 0) pool = NOTES.filter(n => !n.acc);

  // 直前と同じ音は避ける（選択肢が1つしかない場合を除く）
  let candidates = pool.filter(n => n.id !== state.lastId);
  if (candidates.length === 0) candidates = pool;
  const answer = pick(candidates);
  state.current = answer;
  state.lastId = answer.id;
  state.answered = false;
  state.missedThisQ = false;

  // ダミー選択肢：運指が異なる音から、近い音域を優先しつつ選ぶ
  const distractorPool = NOTES
    .filter(n => sig(n.f) !== sig(answer.f) && (useAcc || !n.acc))
    .sort((a, b) => Math.abs(a.midi - answer.midi) - Math.abs(b.midi - answer.midi));
  const near = distractorPool.slice(0, 10); // 近傍10音からランダムに5つ
  const chosen = [];
  const used = new Set([sig(answer.f)]);
  while (chosen.length < 5 && near.length > 0) {
    const i = Math.floor(Math.random() * near.length);
    const n = near.splice(i, 1)[0];
    if (!used.has(sig(n.f))) { used.add(sig(n.f)); chosen.push(n); }
  }
  // 万一足りなければ残りから補充
  for (const n of distractorPool) {
    if (chosen.length >= 5) break;
    if (!used.has(sig(n.f))) { used.add(sig(n.f)); chosen.push(n); }
  }

  const options = [answer, ...chosen].sort(() => Math.random() - 0.5);

  drawStaff(answer);
  const fb = document.getElementById("feedback");
  fb.textContent = "この音の運指はどれ？";
  fb.className = "feedback";

  const box = document.getElementById("choices");
  box.innerHTML = "";
  options.forEach((n, i) => {
    const card = document.createElement("div");
    card.className = "choice";
    card.dataset.correct = (n === answer) ? "1" : "";
    card.appendChild(drawFingering(n.f));
    const num = document.createElement("div");
    num.className = "num";
    num.textContent = String(i + 1);
    card.appendChild(num);
    card.addEventListener("click", () => choose(card, n));
    box.appendChild(card);
  });
}

function choose(card, note) {
  if (state.answered || card.classList.contains("wrong")) return;
  const fb = document.getElementById("feedback");

  if (card.dataset.correct) {
    state.answered = true;
    state.total++;
    if (!state.missedThisQ) { state.ok++; state.streak++; }
    else { state.streak = 0; }
    updateStats();
    card.classList.add("correct");
    document.querySelectorAll(".choice").forEach(c => c.classList.add("disabled"));
    fb.textContent = `正解！ ${state.current.jp}（${state.current.en}）`;
    fb.className = "feedback ok";
    playNote(state.current.midi);
    setTimeout(newQuestion, 1300);
  } else {
    state.missedThisQ = true;
    card.classList.add("wrong");
    fb.textContent = `ちがうよ… それは ${note.jp}（${note.en}）の運指`;
    fb.className = "feedback ng";
  }
}

function updateStats() {
  document.getElementById("stat-ok").textContent = state.ok;
  document.getElementById("stat-total").textContent = state.total;
  document.getElementById("stat-streak").textContent = state.streak;
}

document.getElementById("range").addEventListener("change", newQuestion);
document.getElementById("accidentals").addEventListener("change", newQuestion);

// 設定モーダル
const modal = document.getElementById("modal");
document.getElementById("menu-btn").addEventListener("click", () => { modal.hidden = false; });
document.getElementById("menu-close").addEventListener("click", () => { modal.hidden = true; });
modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") modal.hidden = true; });
document.getElementById("skip").addEventListener("click", () => {
  if (!state.answered) { state.total++; state.streak = 0; updateStats(); }
  newQuestion();
});

// キーボード 1〜6 でも回答できる
document.addEventListener("keydown", e => {
  const i = parseInt(e.key, 10);
  if (i >= 1 && i <= 6) {
    const cards = document.querySelectorAll(".choice");
    if (cards[i - 1]) cards[i - 1].click();
  }
});

newQuestion();
</script>
</body>
</html>
